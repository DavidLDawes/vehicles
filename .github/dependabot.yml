# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # "npm" is the ecosystem identifier for Node projects.
  - package-ecosystem: "npm"
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    groups:
      babel:
        patterns:
          - "@babel/*"
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "@typescript-eslint/*"
    ignore:
      # eslint-plugin-react's latest release (7.37.5) only supports eslint
      # up to ^9.7, so a major bump to eslint 10 fails npm ci with an
      # ERESOLVE peer conflict. Remove this once eslint-plugin-react adds
      # eslint 10 support.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
